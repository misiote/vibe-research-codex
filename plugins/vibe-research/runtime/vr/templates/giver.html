<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>giver · Vibe Research</title><link rel="stylesheet" href="/static/modes.css"><link rel="stylesheet" href="/static/giver_browser.css">
<main class="giver-main"><a class="eyebrow" href="/">Vibe Research ↗</a><header class="giver-header"><div><h1>giver <span>GIt VibE Research</span></h1><p class="hintline">A place for ideas to branch and grow.</p></div><button id="refresh" class="quiet">刷新</button></header><p id="status" role="status" class="statusline"></p>
<section id="catalog" aria-label="项目谱系目录"><label class="giver-search">查找项目<input id="project-search" type="search" aria-label="查找项目"></label><p class="hintline">选择一个项目谱系，查看它的分支与版本。</p><div id="families" class="giver-families"></div><p id="catalog-empty" hidden>没有匹配的项目。</p><details class="giver-new"><summary>新建项目</summary><form id="init-form"><label>名称<input id="init-title" required maxlength="300"></label><label>模式<select id="init-mode"><option value="brainstorming">Brainstorming</option><option value="engineering">Engineering</option></select></label><button class="primary">创建项目</button></form></details></section>
<section id="family-workspace" hidden><button id="back-catalog" class="quiet">← 项目谱系</button><div class="giver-family-heading"><h2 id="family-title"></h2><p id="family-meta"></p></div><nav class="giver-tabs" aria-label="giver views"><button data-view="tree" aria-selected="true">分支树</button><button data-view="log">提交图</button><button data-view="diff">版本比较</button><button data-view="reflog">操作记录</button></nav>
<div class="giver-layout"><section><section id="tree-view"><div id="tree" class="giver-canvas" aria-label="当前谱系的研究分支树"></div></section><section id="log-view" hidden><label class="giver-search">查找版本<input id="version-search" type="search" aria-label="查找版本"></label><p id="version-count" class="hintline"></p><div id="version-results" class="giver-version-results"></div><div id="log" class="giver-canvas" aria-label="当前谱系的提交图"></div></section><section id="diff-view" hidden><div class="giver-compare"><label>来源<select id="diff-source" aria-label="来源"></select></label><label>目标<select id="diff-target" aria-label="目标"></select></label><button id="compare" class="quiet">比较提交</button></div><div id="diff"></div></section><section id="reflog-view" hidden><div id="reflog" class="giver-records"></div></section></section>
<aside class="giver-sidebar"><section class="giver-panel" id="commit-info" hidden aria-live="polite"></section><section class="giver-panel"><h2>项目与分支</h2><div id="family-branches" class="giver-branch-list"></div></section><section class="giver-panel" id="selection" hidden><div id="branch-info"></div><a id="open-project" class="transfer-destination">进入项目 ↗</a><form id="commit-form"><label>提交说明<input id="commit-message" required></label><button class="primary">Commit</button></form><details><summary>派生独立分支</summary><form id="branch-form"><label>分支名称<input id="branch-name" required></label><label>模式<select id="branch-mode"><option value="brainstorming">Brainstorming</option><option value="engineering">Engineering</option></select></label><button class="primary">创建分支</button></form></details><details><summary>标记里程碑</summary><form id="tag-form"><label>标签<input id="tag-name" required></label><button class="quiet">Tag</button></form></details></section></aside></div></section>
<details class="giver-help"><summary>命令</summary><code>/giver status · /giver branch · /giver commit · /giver diff · /giver restore · /vrpet</code><a href="/settings/skills/giver">命令说明 ↗</a></details></main><script src="/static/actions.js"></script><script src="/static/giver_view.js"></script><script src="/static/giver.js"></script></html>
