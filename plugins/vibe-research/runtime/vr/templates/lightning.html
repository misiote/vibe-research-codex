<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lightning · Vibe Research</title><style>*{box-sizing:border-box}body{margin:0}main{margin:auto}.bar{display:flex;gap:10px;align-items:center}</style><link rel="stylesheet" href="/static/modes.css"><main><a class="eyebrow" href="/">Vibe Research ↗</a><nav class="mode-nav" aria-label="Research modes"><a href="/lightning"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13 2-10 12h8l-1 8 11-12h-8l1-8Z"/></svg>Lightning</a><a href="/brainstorming"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.3 6.7L21 12l-6.7 2.3L12 21l-2.3-6.7L3 12l6.7-2.3L12 3Z"/></svg>Brainstorming</a><a href="/engineering"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 6-6 6 6 6m8-12 6 6-6 6M14 4l-4 16"/></svg>Engineering</a></nav><a class="giver-entry" href="/giver">⑂ giver</a><h1>Lightning</h1><p class="hintline">A little space for your next idea.</p><div class="workspace"><aside class="workspace-aside"><h3>草稿箱</h3><div id="drafts" class="space-list"></div><button id="new" class="quiet" title="新建草稿">＋</button></aside><section id="editor" class="editor-surface"><div class="editor-heading"><input class="editor-title" id="title" aria-label="草稿标题" maxlength="120"><button id="save" class="quiet">保存</button><details class="more-menu"><summary aria-label="更多操作">⋯</summary><div class="popover"><button id="export">导出 Markdown</button><button id="discard">丢弃草稿</button></div></details></div><div class="editor-topline"><div class="editor-tools"><label>用途<select id="task"><option value="writing">学术材料</option><option value="keywords">概念发散</option><option value="slides">演示文稿</option><option value="reading">文献阅读</option><option value="history">研究脉络</option><option value="decision">方向比较</option></select></label><label>阅读<select id="depth"><option value="summary">概要</option><option value="skim">粗读</option><option value="deep">精读</option></select></label></div><span id="status" class="statusline" role="status"></span></div><div class="editor-tabs" role="tablist"><button id="input-tab" role="tab" aria-selected="true">想法与材料</button><button id="output-tab" role="tab" aria-selected="false">成果</button></div><textarea id="body" class="editor-area" rows="9" aria-label="想法与材料"></textarea><textarea id="output" class="editor-area" rows="9" aria-label="成果" hidden></textarea><footer class="editor-footer"><p class="muted" id="hint"></p><button id="handoff" class="primary">在 Codex 继续 ↗</button></footer></section></div></main><script src="/static/actions.js"></script><script>
const mode='lightning';
const $=id=>document.getElementById(id);let current=null,rows=[],dirty=false;
function status(t){$('status').textContent=t}
async function api(data){const token=(await VRUI.request('/api/session')).token;return VRUI.request('/api/lightning',{method:'POST',headers:{'Content-Type':'application/json','X-VR-Token':token},body:JSON.stringify(data)});}
async function refresh(){const r=await fetch('/api/lightning?mode='+mode);if(!r.ok)throw Error('无法读取草稿');rows=(await r.json()).drafts;$('drafts').replaceChildren();for(const d of rows){const b=document.createElement('button');b.textContent=d.title||'未命名草稿';b.className=current?.id===d.id?'selected':'';b.onclick=async()=>{if(dirty&&!await VRUI.confirm('放弃尚未保存的修改？'))return;open(d)};$('drafts').append(b)}}
function open(d){$('editor').parentElement.querySelector('.handoff-card')?.remove();current=d;dirty=false;$('editor').hidden=false;for(const k of ['title','task','depth','body','output'])$(k).value=d[k]||'';$('hint').textContent='内容仅保存在此工作区';refresh()}
async function save(){const draft=Object.fromEntries(['title','task','depth','body','output'].map(k=>[k,$(k).value]));current=await api(current?.id?{action:'update',id:current.id,draft:{...draft,expected_updated_at:current.updated_at}}:{action:'start',draft:{...draft,mode}});dirty=false;status('已保存 · '+new Date().toLocaleTimeString());await refresh()}
for(const k of ['title','task','depth','body','output'])$(k).oninput=()=>{dirty=true;status('尚未保存')};
async function action(fn){try{await fn()}catch(e){status(e.message);VRUI.toast(e.message,true)}}
$('new').onclick=()=>action(async()=>{if(dirty&&!await VRUI.confirm('放弃尚未保存的修改？'))return;open(blank());status('')});$('save').onclick=()=>action(save);
$('handoff').onclick=()=>action(()=>VRUI.run($('handoff'),'正在准备…',async()=>{await save();const workspace=(await VRUI.request('/api/workspace')).registry.replace(/[\\/][^\\/]+$/,'');const text='$'+mode+' 继续草稿 '+current.id+'（工作区 '+workspace+'）。读取 lightning packet 后按已选能力与阅读深度完成任务，结果写回草稿；不要创建研究项目。';VRUI.handoff($('editor').parentElement,text);status('任务已准备好')}));
$('export').onclick=()=>action(async()=>{await save();const b=new Blob(['# '+current.title+'\n\n'+current.body+'\n\n'+current.output],{type:'text/markdown;charset=utf-8'}),a=document.createElement('a'),u=URL.createObjectURL(b);a.href=u;a.download=current.id+'.md';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)});
$('discard').onclick=()=>action(async()=>{if(!current?.id){open(blank());status('已清空未保存内容');VRUI.toast('已清空未保存内容');return}if(!await VRUI.confirm('永久丢弃这份草稿？已导出的文件保留。',{title:'丢弃草稿',accept:'丢弃草稿',destructive:true}))return;await VRUI.run($('discard'),'正在丢弃…',async()=>{await api({action:'discard',id:current.id});current=blank();dirty=false;open(current);await refresh();status('已丢弃');VRUI.toast('草稿已丢弃')})});
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});function blank(){return {title:'',task:mode==='brainstorming'?'decision':'writing',depth:mode==='brainstorming'?'skim':'summary',body:'',output:''}}
for(const a of document.querySelectorAll('.mode-nav a'))if(a.pathname==='/'+mode)a.setAttribute('aria-current','page');for(const [id,other] of [['input-tab','output-tab'],['output-tab','input-tab']])$(id).onclick=()=>{$(id).setAttribute('aria-selected','true');$(other).setAttribute('aria-selected','false');$('body').hidden=id!=='input-tab';$('output').hidden=id!=='output-tab'};open(blank());action(refresh);
</script></html>
