<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brainstorming · Vibe Research</title><style>*{box-sizing:border-box}body{margin:0}main{margin:auto}</style><link rel="stylesheet" href="/static/project_nav.css"><link rel="stylesheet" href="/static/modes.css"><body data-project-theme="light"><main><a class="eyebrow" href="/">Vibe Research ↗</a><nav class="mode-nav" aria-label="Research modes"><a href="/lightning"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13 2-10 12h8l-1 8 11-12h-8l1-8Z"/></svg>Lightning</a><a href="/brainstorming"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.3 6.7L21 12l-6.7 2.3L12 21l-2.3-6.7L3 12l6.7-2.3L12 3Z"/></svg>Brainstorming</a><a href="/engineering"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 6-6 6 6 6m8-12 6 6-6 6M14 4l-4 16"/></svg>Engineering</a></nav><a class="giver-entry" href="/giver">⑂ giver</a><h1>Brainstorming</h1><p class="hintline">Where perspectives become possibilities.</p><a id="back-to-spaces" class="project-catalogue-back" href="/brainstorming" hidden>← Projects</a><form id="new-space" class="new-topic"><input id="new-topic" aria-label="研究主题" maxlength="300" required><button class="primary">New project</button></form><label id="catalogue-filter" class="catalogue-filter"><input id="show-hidden" type="checkbox">显示已归档或移除</label><p id="status" class="statusline" role="status"></p><div id="spaces" class="project-list"></div><section id="workspace" hidden><div id="project-navigation" hidden></div><details class="context-card"><summary>主题与背景</summary><input id="topic" aria-label="当前主题" maxlength="300"><textarea id="context" rows="3" aria-label="研究背景"></textarea><button id="save-context" class="quiet">更新背景</button></details><div id="mode-transfer"></div><div id="mode-connections" class="hintline"></div><div id="modules" class="module-grid"></div><section class="editor-surface"><div class="editor-heading"><span class="editor-title" id="module-title"></span><button id="save" class="quiet">保存</button></div><textarea id="content" class="editor-area" rows="10" aria-label="模块内容"></textarea><details class="module-meta"><summary>来源与参考模块</summary><p class="hintline">仅选取这次实际参考的内容；模块可以独立开展。</p><div id="uses"></div><textarea id="sources" aria-label="来源 URL" rows="3"></textarea></details><footer class="editor-footer"><span id="module-status" class="muted"></span><button id="handoff" class="primary">在 Codex 继续 ↗</button></footer></section></section></main><script src="/static/project_nav.js"></script><script src="/static/mode_bridge.js"></script><script src="/static/actions.js"></script><script>
const $=id=>document.getElementById(id),make=(tag,text)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e};let current=null,catalog={},selected='directions',dirty=false,contextDirty=false,bridgeUI=null,visibleSpaces=[];
function status(t){$('status').textContent=t}async function action(fn){try{await fn()}catch(e){status(e.message);VRUI.toast(e.message,true)}}async function get(path){return VRUI.request(path)}async function post(data){const t=await get('/api/session');return VRUI.request('/api/brainstorm',{method:'POST',headers:{'Content-Type':'application/json','X-VR-Token':t.token},body:JSON.stringify(data)});}
async function canLeave(){if((dirty||contextDirty)&&!await VRUI.confirm('放弃尚未保存的修改并切换视图？'))return false;dirty=false;contextDirty=false;return true}function catalogue(selected){for(const id of ['new-space','catalogue-filter','spaces'])$(id).hidden=selected;$('back-to-spaces').hidden=!selected;}async function list(){const d=await get('/api/brainstorm'+($('show-hidden').checked?'?include_hidden=1':''));catalog=d.modules;visibleSpaces=d.spaces;if(current&&!visibleSpaces.some(b=>b.id===current.id)){current=null;$('workspace').hidden=true;catalogue(false);bridgeUI?.sync();}if(d.hidden_count&&!$('show-hidden').checked)status(d.hidden_count+' 个已归档或移除的主题已隐藏，可勾选上方选项查看。');$('spaces').replaceChildren();for(const b of d.spaces){const button=make('button');button.append(make('strong',b.topic));if(b.branch)button.append(make('small',b.branch));button.append(make('span',b.visibility==='removed'?'已从入口移除 · 查看 →':b.visibility==='archived'?'已归档 · 查看 →':'Open →'));button.className='project-card'+(b.id===current?.id?' selected':'');button.setAttribute('aria-pressed',String(b.id===current?.id));button.onclick=()=>action(async()=>{if((dirty||contextDirty)&&!await VRUI.confirm('放弃尚未保存的修改？'))return;current=await get('/api/brainstorm?id='+b.id);dirty=false;contextDirty=false;render();await list()});$('spaces').append(button)}}
function render(){if(!current)return;catalogue(true);VRProjectNav.mount($('project-navigation'),{project:current.project,mode:'brainstorming',board:current.id,title:current.topic,view:'mode',beforeNavigate:canLeave});const address=new URL(location.href);address.searchParams.set('space',current.id);history.replaceState(null,'',address);$('workspace').querySelector('.handoff-card')?.remove();bridgeUI?.sync();$('mode-connections').replaceChildren();for(const c of current.connections||[]){const a=make('a','Engineering ↗');a.href='/p/'+c.project+'/engineering';$('mode-connections').append(a,document.createTextNode(' · '+({promote:'构想关联',abstract:'进展回顾'}[c.direction]||'关联')+' · '+new Date(c.at).toLocaleDateString()+' '))}$('workspace').hidden=false;if(!contextDirty){$('topic').value=current.topic;$('context').value=current.context;}$('modules').replaceChildren();for(const [key,m] of Object.entries(catalog)){const b=make('button');b.className=key===selected?'active':'';b.append(make('strong',m.title),make('small',current.modules[key]?(current.modules[key].needs_review?'待复核':'v'+current.modules[key].revision):'Open'));b.onclick=async()=>{if((dirty||contextDirty)&&!await VRUI.confirm('放弃尚未保存的修改？'))return;selected=key;dirty=false;render()};$('modules').append(b)}const m=current.modules[selected];$('module-title').textContent=catalog[selected].title;$('content').value=m?.content||'';$('sources').value=(m?.sources||[]).join('\n');$('uses').replaceChildren();for(const [key,other] of Object.entries(current.modules)){if(key===selected)continue;const label=make('label'),checkbox=make('input');checkbox.type='checkbox';checkbox.value=key;checkbox.checked=Boolean(m?.uses?.[key]);label.append(checkbox,document.createTextNode(' '+catalog[key].title+' · v'+other.revision));$('uses').append(label)}$('module-status').textContent=m?(m.needs_review?'参考内容已变化，建议复核':'已保存 · '+new Date(m.updated_at).toLocaleDateString()):'从任一模块开始';}
async function save(){const uses=Object.fromEntries([...$('uses').querySelectorAll('input:checked')].map(e=>[e.value,current.modules[e.value].revision]));current=await post({action:'update',id:current.id,spec:{module:selected,content:$('content').value,sources:$('sources').value.split('\n').map(x=>x.trim()).filter(Boolean),uses,expected_updated_at:current.updated_at}});dirty=false;status('已保存');render();await list()}
$('back-to-spaces').onclick=e=>{e.preventDefault();action(async()=>{if(await canLeave())location.assign('/brainstorming')})};$('new-space').onsubmit=e=>{e.preventDefault();action(async()=>{if((dirty||contextDirty)&&!await VRUI.confirm('放弃尚未保存的修改？'))return;current=await post({action:'start',spec:{topic:$('new-topic').value}});dirty=false;$('new-topic').value='';await list();render();status('Brainstorming 项目已建立')})};$('save').onclick=()=>action(save);$('content').oninput=$('sources').oninput=()=>{dirty=true;status('尚未保存')};$('topic').oninput=$('context').oninput=()=>{contextDirty=true;status('背景尚未保存')};$('save-context').onclick=()=>action(async()=>{const topic=$('topic').value,context=$('context').value;if(dirty)await save();current=await post({action:'update',id:current.id,spec:{topic,context,expected_updated_at:current.updated_at}});dirty=false;contextDirty=false;render();await list();status('背景已更新')});
$('handoff').onclick=()=>action(()=>VRUI.run($('handoff'),'正在准备…',async()=>{if(contextDirty)throw Error('请先保存主题背景');if(dirty)await save();const workspace=(await get('/api/workspace')).registry.replace(/[\\/][^\\/]+$/,'');VRUI.handoff($('workspace'),'$brainstorming 继续主题空间 '+current.id+' 的 '+selected+' 模块，工作区 '+workspace+'。读取 brainstorm packet，按本次需求开展工作，只更新当前模块，并记录实际来源与引用版本。');status('任务已准备好')}));addEventListener('beforeunload',e=>{if(dirty||contextDirty){e.preventDefault();e.returnValue=''}});for(const a of document.querySelectorAll('.mode-nav a'))if(a.pathname==='/brainstorming')a.setAttribute('aria-current','page');bridgeUI=VRBridge.mount($('mode-transfer'),{direction:'promote',getBoard:()=>current,beforePreview:async()=>{if(contextDirty)throw Error('请先保存主题背景');if(dirty)await save()},refresh:async()=>{current=await get('/api/brainstorm?id='+current.id);render()}});$('show-hidden').onchange=()=>action(async()=>{if((dirty||contextDirty)&&!await VRUI.confirm('切换显示范围会放弃尚未保存的修改，继续？')){$('show-hidden').checked=!$('show-hidden').checked;return}dirty=false;contextDirty=false;status('');await list()});action(async()=>{await list();const id=new URLSearchParams(location.search).get('space');if(id&&visibleSpaces.some(b=>b.id===id)){current=await get('/api/brainstorm?id='+encodeURIComponent(id));selected=current.modules.progress?'progress':'directions';render();await list()}});
</script></html>
