<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brainstorming · Vibe Research</title><link rel="stylesheet" href="/static/project_nav.css"><link rel="stylesheet" href="/static/modes.css"><link rel="stylesheet" href="/static/project_theme.css"><body data-project-theme="dark"><main><a class="eyebrow" href="/">← Vibe Research</a><nav class="mode-nav" aria-label="Research modes"><a href="/lightning">Lightning</a><a href="/brainstorming" aria-current="page">Brainstorming</a><a href="/engineering">Engineering</a></nav><a class="giver-entry" href="/giver" aria-label="研究版本树"></a><h1 id="page-title">Brainstorming</h1><p id="intro" class="hintline">Where perspectives become possibilities.</p><a id="back-to-spaces" class="project-catalogue-back" href="/brainstorming" hidden>← Projects</a><form id="new-space" class="new-topic"><input id="new-topic" aria-label="研究主题" maxlength="300" required><button class="primary">New project</button></form><label id="catalogue-filter" class="catalogue-filter"><input id="show-hidden" type="checkbox">显示已归档或移除</label><p id="status" class="statusline" role="status"></p><div id="spaces" class="project-list"></div><section id="workspace" hidden><div id="project-navigation" hidden></div><nav class="brainstorm-tabs" aria-label="Brainstorming 工作区"><span aria-current="page" class="icon-link" style="width:auto;padding:9px 15px">研究笔记</span><a id="history-link">研究历史</a><a id="direction-link">方向决策</a></nav><section class="editor-surface"><div class="notes-controls"><h2>研究笔记</h2><select id="record" aria-label="查看已有记录"></select><button id="handoff" class="primary" style="margin-left:auto">在 Codex 继续 ↗</button></div><div id="note-text" class="notes-readout"></div><p id="module-status" class="muted" style="padding:0 24px"></p><details id="edit-note" class="notes-editor"><summary>补充笔记</summary><textarea id="content" aria-label="研究笔记内容"></textarea><div class="actions"><button id="save" class="primary">保存笔记</button></div></details><details id="references" class="module-meta" hidden><summary>来源与关联</summary><div id="sources"></div></details></section><details class="context-card"><summary>主题与背景</summary><input id="topic" aria-label="当前主题" maxlength="300"><textarea id="context" rows="3" aria-label="研究背景"></textarea><button id="save-context" class="quiet">更新背景</button></details><div id="mode-transfer"></div><div id="mode-connections" class="hintline"></div></section></main><script src="/static/actions.js"></script><script src="/static/workspace_ui.js"></script><script src="/static/project_nav.js"></script><script src="/static/mode_bridge.js"></script><script>
const $=id=>document.getElementById(id),make=(tag,text)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e};let current=null,catalog={},selected='notes',dirty=false,contextDirty=false,bridgeUI=null,visibleSpaces=[];
function status(t){$('status').textContent=t}async function action(fn){try{await fn()}catch(e){status(e.message);VRUI.toast(e.message,true)}}async function get(path){return VRUI.request(path)}async function post(data){const t=await get('/api/session');return VRUI.request('/api/brainstorm',{method:'POST',headers:{'Content-Type':'application/json','X-VR-Token':t.token},body:JSON.stringify(data)})}
async function canLeave(){if((dirty||contextDirty)&&!await VRUI.confirm('放弃尚未保存的修改并切换视图？'))return false;dirty=false;contextDirty=false;return true}
function catalogue(active){for(const id of ['new-space','catalogue-filter','spaces','intro'])$(id).hidden=active;document.querySelector('.mode-nav').hidden=active;$('back-to-spaces').hidden=!active;const toolbar=document.querySelector('.workspace-tools');if(toolbar)toolbar.hidden=active}
async function list(){const d=await get('/api/brainstorm'+($('show-hidden').checked?'?include_hidden=1':''));catalog=d.modules;visibleSpaces=d.spaces;if(current&&!visibleSpaces.some(b=>b.id===current.id)){current=null;$('workspace').hidden=true;catalogue(false);bridgeUI?.sync()}$('spaces').replaceChildren();for(const b of d.spaces){const button=make('button');button.className='project-card';button.append(make('strong',b.topic),make('span',b.visibility==='removed'?'已从入口移除 · 查看 →':b.visibility==='archived'?'已归档 · 查看 →':'Open →'));button.onclick=()=>action(async()=>{if(!await canLeave())return;current=await get('/api/brainstorm?id='+b.id);selected='notes';render()});$('spaces').append(button)}}
function render(){if(!current)return;catalogue(true);$('workspace').hidden=false;$('page-title').textContent=current.topic;VRProjectNav.mount($('project-navigation'),{project:current.project,mode:'brainstorming',board:current.id,title:current.topic,view:'notes',beforeNavigate:canLeave});const address=new URL(location.href);address.searchParams.set('space',current.id);history.replaceState(null,'',address);$('history-link').href='/p/'+current.project+'/explore#history';$('direction-link').href='/p/'+current.project+'/explore#direction';$('record').replaceChildren();for(const key of ['notes',...Object.keys(current.modules).filter(k=>k!=='notes')]){const option=make('option',catalog[key]?.title||key);option.value=key;$('record').append(option)}$('record').value=selected;$('record').hidden=Object.keys(current.modules).filter(k=>k!=='notes').length===0;const m=current.modules[selected];$('note-text').textContent=m?.content||(selected==='notes'?Object.entries(current.modules).filter(([k])=>k!=='notes').map(([k,v])=>(catalog[k]?.title||k)+'\n\n'+v.content).join('\n\n—\n\n'):'')||'还没有笔记。在 Codex 中提出问题，阅读与讨论的成果会逐步汇集到这里。';$('content').value=m?.content||'';$('module-status').textContent=m?(m.needs_review?'参考材料已有更新，建议在 Codex 中复核。':'v'+m.revision+' · '+new Date(m.updated_at).toLocaleString()):'';$('edit-note').hidden=selected!=='notes';$('edit-note').open=false;$('sources').replaceChildren();for(const url of m?.sources||[]){const a=make('a',url);a.href=url;a.rel='noopener noreferrer';a.target='_blank';$('sources').append(a,make('br'))}$('references').hidden=!(m?.sources?.length||Object.keys(m?.uses||{}).length);for(const [key,revision] of Object.entries(m?.uses||{}))$('sources').append(make('p',(catalog[key]?.title||key)+' · v'+revision));if(!contextDirty){$('topic').value=current.topic;$('context').value=current.context}$('mode-connections').replaceChildren();for(const c of current.connections||[]){const a=make('a','关联 Engineering ↗');a.href='/p/'+c.project+'/engineering';$('mode-connections').append(a)}bridgeUI?.sync()}
async function save(){const m=current.modules.notes||{};current=await post({action:'update',id:current.id,spec:{module:'notes',content:$('content').value,sources:m.sources||[],uses:m.uses||{},expected_updated_at:current.updated_at}});dirty=false;status('笔记已保存');render()}
$('record').onchange=()=>action(async()=>{if(!await canLeave()){$('record').value=selected;return}selected=$('record').value;render()});$('content').oninput=()=>{dirty=true;status('笔记尚未保存')};$('save').onclick=()=>action(save);$('back-to-spaces').onclick=e=>{e.preventDefault();action(async()=>{if(await canLeave())location.assign('/brainstorming')})};
$('new-space').onsubmit=e=>{e.preventDefault();action(async()=>{if(!await canLeave())return;current=await post({action:'start',spec:{topic:$('new-topic').value}});selected='notes';$('new-topic').value='';await list();render();status('项目已建立')})};$('topic').oninput=$('context').oninput=()=>{contextDirty=true;status('背景尚未保存')};$('save-context').onclick=()=>action(async()=>{const topic=$('topic').value,context=$('context').value;if(dirty)await save();current=await post({action:'update',id:current.id,spec:{topic,context,expected_updated_at:current.updated_at}});contextDirty=false;render();await list();status('背景已更新')});
$('handoff').onclick=()=>action(()=>VRUI.run($('handoff'),'正在准备…',async()=>{if(contextDirty)throw Error('请先保存修改的背景');if(dirty)await save();const workspace=(await get('/api/workspace')).registry.replace(/[\\/][^\\/]+$/,'');VRUI.handoff($('workspace'),'$brainstorming 继续研究项目 '+current.id+'，工作区 '+workspace+'。先阅读已有笔记与研究图，再根据本次需求选择阅读、研究历史、方向分析或材料整理能力，将实际成果写回研究笔记或相应研究记录。无需用户逐项填写模块。');status('任务已准备好')}));
for(const link of [$('history-link'),$('direction-link')])link.onclick=e=>{e.preventDefault();action(async()=>{if(await canLeave())location.assign(link.href)})};addEventListener('beforeunload',e=>{if(dirty||contextDirty){e.preventDefault();e.returnValue=''}});bridgeUI=VRBridge.mount($('mode-transfer'),{direction:'promote',getBoard:()=>current,beforePreview:async()=>{if(contextDirty)throw Error('请先保存主题背景');if(dirty)await save()},refresh:async()=>{current=await get('/api/brainstorm?id='+current.id);render()}});$('show-hidden').onchange=()=>action(async()=>{if(!await canLeave())return;await list()});action(async()=>{await list();const id=new URLSearchParams(location.search).get('space');if(id&&visibleSpaces.some(b=>b.id===id)){current=await get('/api/brainstorm?id='+encodeURIComponent(id));render()}});
</script></body></html>
