<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Engineering · Vibe Research</title><link rel="stylesheet" href="/static/engineering_page.css"><link rel="stylesheet" href="/static/project_nav.css"><link rel="stylesheet" href="/static/modes.css"><link rel="stylesheet" href="/static/project_theme.css"><body data-project-theme="dark"><main><a id="workbench" class="eyebrow" href="/">Vibe Research ↗</a><nav class="mode-nav" aria-label="Research modes"><a href="/lightning"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13 2-10 12h8l-1 8 11-12h-8l1-8Z"/></svg>Lightning</a><a href="/brainstorming"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.3 6.7L21 12l-6.7 2.3L12 21l-2.3-6.7L3 12l6.7-2.3L12 3Z"/></svg>Brainstorming</a><a href="/engineering"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 6-6 6 6 6m8-12 6 6-6 6M14 4l-4 16"/></svg>Engineering</a></nav><a class="giver-entry" href="/giver" aria-label="研究版本树" title="研究版本树"></a><h1>Engineering</h1><p class="hintline">Where ideas take shape.</p><p id="status" class="statusline" role="status"></p><section id="choose"><div id="projects" class="project-list"></div><a href="/?new=1">＋ Project</a></section><section id="project" hidden><div id="project-navigation" hidden></div><p class="bar"><button id="refresh" class="quiet">刷新视图</button></p><div id="mode-transfer"></div><div id="mode-connections" class="hintline"></div><div id="links"></div><details class="panel"><summary>关联环境</summary><form id="link-form"><div class="grid"><label>名称<input id="link-title" maxlength="120"></label><label>本地 Git 仓库<input id="repo"></label><label>GitHub<input id="github" type="url"></label><label>W&amp;B<input id="wandb" type="url"></label><label>MLflow Tracking URI<input id="mlflow" type="url"></label><label>MLflow experiment IDs<input id="mlflow-ids"></label><label>SSH Host<input id="ssh-host"></label><label>远程仓库<input id="ssh-repo"></label><label>指标键<input id="metrics"></label></div><p class="muted">认证沿用本机 gh、SSH 配置或服务环境变量。SSH 使用已知主机校验；MLflow 可使用已有本地隧道。此处只填写地址与项目范围。</p><button>保存关联</button></form></details><h2>工作包</h2><div id="tasks"></div><details class="panel"><summary>规划工作包</summary><form id="task-form"><div class="grid"><label>标题<input id="task-title" required maxlength="200"></label><label>关联记录<select id="refs" multiple required size="4"></select></label><label>研究问题<textarea id="question" required></textarea></label><label>验收标准<textarea id="acceptance" required></textarea></label><label>实施与评估方案<textarea id="protocol" required></textarea></label><label>停止条件<textarea id="stop-rule" required></textarea></label></div><button>保存计划</button></form></details><h2>运行与结果</h2><div id="experiments"></div></section></main><script src="/static/actions.js"></script><script src="/static/workspace_ui.js"></script><script src="/static/project_nav.js"></script><script src="/static/mode_bridge.js"></script><script>
const $=id=>document.getElementById(id),make=(tag,text)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e};const match=location.pathname.match(/^\/p\/(p[a-f0-9]{12})\/engineering$/),prefix=match?'/p/'+match[1]:'';let state={},bridgeUI=null;
function status(t){$('status').textContent=t}async function action(fn){try{await fn()}catch(e){status(e.message)}}
async function get(path){const r=await fetch(path),d=await r.json();if(!r.ok)throw Error(d.error||'读取失败');return d}async function post(data){const t=await get('/api/session'),r=await fetch(prefix+'/api/research',{method:'POST',headers:{'Content-Type':'application/json','X-VR-Token':t.token},body:JSON.stringify(data)}),d=await r.json();if(!r.ok)throw Error(d.error||'操作未完成');return d}
function link(text,url){const a=make('a',text);a.href=url;return a}
async function refresh(){const d=await get(prefix+'/api/research/engineering');const latest=[...(d.transfers||[])].reverse().find(n=>n.data.direction==='abstract'&&n.data.board);if(latest)bridgeUI?.restore({board:latest.data.board,project:match[1]});$('mode-connections').replaceChildren();for(const n of d.transfers||[])if(n.data.board){const a=link('Brainstorming ↗','/brainstorming?space='+n.data.board);$('mode-connections').append(a,document.createTextNode(' · '+n.title+' '))}state=await get(prefix+'/api/state');$('refs').replaceChildren();for(const n of Object.values(state.nodes||{})){if(!['RQ','G','H','X','R','A'].includes(n.kind))continue;const o=make('option',n.id+' · '+n.title);o.value=n.id;$('refs').append(o)}$('links').replaceChildren();for(const n of d.links){const c=make('article');c.append(make('h3',n.title));const bar=make('div');bar.className='bar';for(const [k,url] of Object.entries({...n.data.editors,...n.data.tools}))bar.append(link(k==='wandb'?'W&B':k,url));if(n.data.ssh)bar.append(link('VS Code Remote','vscode://vscode-remote/ssh-remote+'+encodeURIComponent(n.data.ssh.host)+n.data.ssh.repo.split('/').map(encodeURIComponent).join('/')));c.append(bar);for(const network of [false,true]){const b=make('button',network?'同步开发进度':'读取本地状态');b.onclick=()=>action(async()=>{b.disabled=true;status('正在读取…');try{await post({action:'engineering_sync',id:n.id,network});await refresh();status('快照已更新')}finally{b.disabled=false}});c.append(b,document.createTextNode(' '))}const obs=d.observations.filter(o=>o.data.link===n.id).at(-1);if(obs){for(const [name,o] of Object.entries(obs.data.observations)){const line=make('details');line.append(make('summary',name+' · '+({observed:'已采集',unavailable:'待检查',not_checked:'未读取'})[o.status]+' · '+new Date(o.checked_at).toLocaleString()),make('pre',JSON.stringify(o.data||o,null,2)));c.append(line)}const groups=obs.data.commit_groups.filter(g=>g.sources.length>1);for(const g of groups)c.append(make('p','版本关联 '+g.commit.slice(0,8)+' · '+g.sources.join(' / ')))}else c.append(make('p','尚无进度快照'));$('links').append(c)}if(!d.links.length)$('links').append(make('p','关联一个环境，开始记录开发进展。'));$('tasks').replaceChildren();for(const n of d.tasks){const c=make('article'),detail=make('details');c.append(make('h3',n.title),make('span',n.data.execution_status));detail.append(make('summary','工作包详情'),make('p',n.data.question),make('p','验收：'+n.data.acceptance),make('p','方案：'+n.data.protocol),make('p','停止条件：'+n.data.stop_rule));for(const u of n.data.updates||[])detail.append(make('p',u.at+' · '+u.state+' · '+u.note));c.append(detail);const form=make('form'),select=make('select'),note=make('input'),evidence=make('input'),button=make('button','更新状态');select.setAttribute('aria-label','工作包状态');for(const [v,t] of Object.entries({planned:'计划',working:'进行中',blocked:'受阻',completed:'完成',abandoned:'终止'})){const o=make('option',t);o.value=v;select.append(o)}select.value=n.data.execution_status;note.setAttribute('aria-label','状态说明');note.required=true;evidence.setAttribute('aria-label','验收记录编号，逗号分隔');form.append(select,note,evidence,button);form.onsubmit=e=>{e.preventDefault();action(async()=>{await post({action:'engineering_task',spec:{id:n.id,state:select.value,note:note.value,evidence:evidence.value.split(',').map(x=>x.trim()).filter(Boolean)}});await refresh();status('工作包已更新')})};c.append(form);$('tasks').append(c)}$('experiments').replaceChildren();for(const n of d.experiments)$('experiments').append(link(n.title,prefix+'/node/'+n.id),make('br'));}
$('link-form').onsubmit=e=>{e.preventDefault();action(async()=>{const tools={};for(const k of ['github','wandb','mlflow'])if($(k).value.trim())tools[k]=$(k).value.trim();const spec={title:$('link-title').value,repo:$('repo').value,tools,metric_keys:$('metrics').value.split(',').map(x=>x.trim()).filter(Boolean),mlflow_experiments:$('mlflow-ids').value.split(',').map(x=>x.trim()).filter(Boolean)};if($('ssh-host').value)spec.ssh={host:$('ssh-host').value,repo:$('ssh-repo').value};const d=await post({action:'engineering_link',spec});status('已关联 '+d.id);await refresh()})};$('task-form').onsubmit=e=>{e.preventDefault();action(async()=>{await post({action:'engineering_task',spec:{title:$('task-title').value,question:$('question').value,acceptance:$('acceptance').value,protocol:$('protocol').value,stop_rule:$('stop-rule').value,refs:[...$('refs').selectedOptions].map(o=>o.value)}});status('工作包已保存');await refresh()})};$('refresh').onclick=()=>action(refresh);
for(const a of document.querySelectorAll('.mode-nav a'))if(a.pathname==='/engineering')a.setAttribute('aria-current','page');
action(async()=>{if(prefix){$('choose').hidden=true;$('project').hidden=false;$('workbench').href='/';bridgeUI=VRBridge.mount($('mode-transfer'),{direction:'abstract',project:match[1],refresh});await refresh()}else{const d=await get('/api/projects');for(const p of d.projects.filter(p=>p.lifecycle==='active'&&p.mode!=='brainstorming')){const c=make('article');c.className='project-card';c.append(make('h3',p.name));if(p.giver_branch)c.append(make('small',p.giver_branch));c.append(link('Open →','/p/'+p.id+'/engineering'));$('projects').append(c)}}});
</script></html>
